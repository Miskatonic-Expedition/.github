name: Update organization contributors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out .github repository
        uses: actions/checkout@v4

      - name: Collect contributors and update profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: Miskatonic-Expedition
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 scripts/update_org_contributors.py

      - name: Commit updated contributor list
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "Contributor list is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: update organization contributors"
          git push
